<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов экспорта чата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* -------------------------------------- */
        /* CSS Переменные для адаптации темы Telegram */
        /* -------------------------------------- */
        :root {
            /* По умолчанию (светлая тема) */
            --tg-bg: #f5f5f5;
            --tg-secondary-bg: white;
            --tg-text: #333;
            --tg-hint: #666;
            --tg-link: #0088cc;
            --tg-button: #0088cc;
            --tg-button-text: white;
            --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --tg-error-bg: #ffe6e6;
            --tg-error-border: #ff9999;
            --tg-error-text: #d32f2f;
        }

        /* -------------------------------------- */
        /* ОСНОВНЫЕ СТИЛИ */
        /* -------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-bg);
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--tg-secondary-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--tg-shadow);
            color: var(--tg-text);
        }

        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--tg-text);
        }

        .user-info {
            color: var(--tg-hint);
            font-size: 13px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--tg-hint);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .info-text {
            color: var(--tg-text);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--tg-secondary-bg);
            border-radius: 8px;
            border-left: 4px solid var(--tg-link);
            box-shadow: none;
        }

        .info-text b {
            color: var(--tg-link);
            font-weight: 600;
        }

        .upload-zone {
            border: 2px dashed var(--tg-link);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--tg-secondary-bg);
        }

        .upload-zone:hover {
            border-color: var(--tg-link);
            background: var(--tg-bg);
        }

        .upload-zone.drag-over {
            background: var(--tg-bg);
            border-color: var(--tg-link);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
            color: var(--tg-link);
        }

        .upload-text {
            color: var(--tg-text);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .upload-hint {
            color: var(--tg-hint);
            font-size: 12px;
        }

        .combine-row {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            background: var(--tg-secondary-bg);
            border: 1px solid var(--tg-hint);
            border-color: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: var(--tg-text);
            align-items: center;
            gap: 10px;
        }

        .combine-row label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
        }

        .combine-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        input[type="file"] {
            display: none;
        }

        .files-list {
            margin-top: 16px;
            max-height: 240px;
            overflow-y: auto;
        }

        .file-item {
            display: grid;
            grid-template-columns: 1fr 20% auto;
            align-items: center;
            padding: 8px 8px;
            background: var(--tg-bg);
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 13px;
            min-height: 0;
            line-height: 1.3;
            gap: 8px;
        }

        .file-item.error-file {
            background: var(--tg-error-bg);
            border: 1px solid var(--tg-error-border);
        }

        .file-name {
            width: 100%;
            word-break: break-all;
            color: var(--tg-text);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: var(--tg-hint);
            font-size: 12px;
            white-space: nowrap;
            text-align: right;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--tg-hint);
            cursor: pointer;
            padding: 0 4px;
            font-size: 16px;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .btn-remove:hover {
            color: var(--tg-error-text);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: var(--tg-hint);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--tg-hint);
            border-top-color: var(--tg-link);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: var(--tg-error-text);
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            pointer-events: all;
        }

        .progress-container {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: var(--tg-bg);
            border-radius: 8px;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 24px;
            background: var(--tg-hint);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: var(--tg-link);
            border-radius: 12px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tg-button-text);
            font-size: 12px;
            font-weight: 600;
        }

        .file-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            color: var(--tg-text);
        }

        .file-progress-name {
            flex: 1;
            word-break: break-all;
        }

        .file-progress-status {
            margin-left: 8px;
            font-size: 16px;
            color: var(--tg-link); /* Цвет статуса - ссылка */
        }

        .scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 100;
            animation: bounce 2s infinite;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📤 Загрузка файлов экспорта</h1>
    <div class="user-info" id="userInfo">Загрузка...</div>

    {% if debug_mode %}
    <div class="debug-mode" id="debugMode"
         style="background: var(--tg-bg); border: 1px solid var(--tg-hint); padding: 12px; margin: 16px 0; border-radius: 6px;">
        <strong>🐛 DEBUG MODE</strong><br>
        <label for="debugUserId" style="display: block; margin-top: 8px;">User ID (для тестирования):</label>
        <input type="text" id="debugUserId" placeholder="Введите User ID"
               style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--tg-hint); border-radius: 4px; background: var(--tg-secondary-bg); color: var(--tg-text);">
        <button id="debugSetUserId"
                style="margin-top: 8px; padding: 6px 12px; background: var(--tg-link); border: none; border-radius: 4px; cursor: pointer; color: var(--tg-button-text);">
            Установить User ID
        </button>
    </div>
    {% endif %}

    <div class="info-text">
        📋 <b>Требования:</b><br>
        • Только JSON файлы<br>
        • Максимум 10 файлов за раз<br>
        • Размер каждого файла до 2 ГБ
    </div>

    <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Кликни или перетащи JSON файлы</div>
        <div class="upload-hint">Только формат JSON</div>
    </div>

    <div class="combine-row" id="combineRow">
        <label>
            <input type="checkbox" id="combineCheckbox">
            <span>Объединить результаты в один файл (название: combined-export-дата.xlsx)</span>
        </label>
    </div>

    <input type="file" id="fileInput" multiple accept=".json,application/json">

    <div class="files-list" id="filesList"></div>

    <div id="statusMessage" style="margin-top: 16px; font-size: 14px; text-align: center; color: var(--tg-hint);"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Обработка файлов...</p>
    </div>

    <div class="error" id="error"></div>
    <div class="overlay" id="overlay"></div>
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div id="filesProgress"></div>
    </div>
    <div class="scroll-indicator" id="scrollIndicator">⬇ Прокрутите вниз</div>
</div>

<script>
    // Инициализация Telegram WebApp (если доступен)
    const debugMode = {% if debug_mode %}true{% else %}false{% endif %};
    console.log('DEBUG MODE:', debugMode);
    let tg = null;

    if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    } else {
        console.log('Telegram WebApp not available (opened in browser)');
    }

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const filesList = document.getElementById('filesList');
    const combineRow = document.getElementById('combineRow');
    const combineCheckbox = document.getElementById('combineCheckbox');
    // const submitBtn = document.getElementById('submitBtn'); // Удалена, используется tg.MainButton
    const loading = document.getElementById('loading');
    const userInfo = document.getElementById('userInfo');
    const errorEl = document.getElementById('error');
    const overlay = document.getElementById('overlay');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const filesProgress = document.getElementById('filesProgress');
    const statusMessage = document.getElementById('statusMessage');

    const MAX_FILES = 10;
    let files = [];
    let userId = null;
    let userName = null;
    let uploadStartTime = null;
    let progressTimeout = null;
    // Переменные для функции startUpload
    let currentFiles = null;
    let currentIsLargeFile = false;
    let currentXhr = null;
    let uploadRetryCount = 0;
    let currentFormData = null;

    // Централизованные настройки
    const CHUNK_SIZE = 10485760; // Размер чанка в байтах
    const MAX_RETRIES = 3; // Максимум попыток загрузки чанка/файла

    // ФУНКЦИИ АДАПТАЦИИ ТЕМЫ И КНОПКИ

    // Применяет цвета темы Telegram к CSS-переменным.

    function applyTheme() {
        // Проверяем наличие объекта Telegram и параметров темы
        if (typeof tg !== 'undefined' && tg?.themeParams) {
            const root = document.documentElement;
            const params = tg.themeParams;

            // CSS-переменные (для элементов внутри Web App)
            root.style.setProperty('--tg-bg', params.bg_color || '#f5f5f5');
            root.style.setProperty('--tg-secondary-bg', params.secondary_bg_color || '#ffffff');
            root.style.setProperty('--tg-text', params.text_color || '#333333');
            root.style.setProperty('--tg-hint', params.hint_color || '#666666');
            root.style.setProperty('--tg-link', params.link_color || '#0088cc');
            root.style.setProperty('--tg-button', params.button_color || '#0088cc');
            root.style.setProperty('--tg-button-text', params.button_text_color || '#ffffff');

            // Обновляем нативную кнопку MainButton напрямую через HEX-коды
            // значения из params, а не через var(--...)
            if (tg.MainButton) {
                tg.MainButton.setParams({
                    color: params.button_color || '#0088cc',
                    text_color: params.button_text_color || '#ffffff'
                });
            }

            // Адаптация специфичных стилей (тени, ошибки) под цветовую схему
            if (tg.colorScheme === 'dark') {
                root.style.setProperty('--tg-shadow', '0 4px 12px rgba(0,0,0,0.4)');
                root.style.setProperty('--tg-error-bg', '#3d1f1f');
                root.style.setProperty('--tg-error-border', '#cc4444');
                root.style.setProperty('--tg-error-text', '#ff9999');
            } else {
                // сбрасываем значения, если пользователь переключился обратно на светлую тему
                root.style.setProperty('--tg-shadow', '0 2px 8px rgba(0,0,0,0.1)');
                root.style.setProperty('--tg-error-bg', '#ffe6e6');
                root.style.setProperty('--tg-error-border', '#ff9999');
                root.style.setProperty('--tg-error-text', '#d32f2f');
            }
        }
    }

    // Обновляет состояние Главной кнопки Telegram.

    function updateMainButtonState() {
        if (typeof tg !== 'undefined' && tg?.MainButton) {
            const mb = tg.MainButton;

            if (files.length > 0 && userId) {
                const text = `Обработать ${files.length} файл(ов)`;
                mb.setText(text);
                mb.show();
                mb.enable();
            } else {
                mb.hide();
            }
        }
    }

    // ГЛОБАЛЬНЫЕ ФУНКЦИИ UI И ОШИБОК

    function showError(message) {
        errorEl.textContent = '❌ ' + message;
        errorEl.style.display = 'block';
        statusMessage.textContent = '';
    }

    // Централизованный обработчик ошибок.
    // Сбрасывает UI, отображает сообщение и уведомляет Telegram.

    function handleError(message, logError = true, closeWebApp = false) {
        if (logError) {
            console.error('Handled Error:', message);
        }
        showError(message);

        // Сброс UI
        overlay.style.display = 'none';
        progressContainer.style.display = 'none';
        loading.style.display = 'none';

        // Сброс состояния загрузки
        if (typeof uploadRetryCount !== 'undefined') {
            uploadRetryCount = 0;
        }
        updateMainButtonState(); // Сбросит MainButton в состояние "Готов" или скроет

        // Отправляем данные об ошибке в Telegram
        if (typeof tg !== 'undefined' && tg && tg.sendData) {
            tg.sendData(JSON.stringify({
                success: false,
                message: '❌ ' + message,
                user_id: userId
            }));
        }

        // Закрываем WebApp, если это необходимо
        if (closeWebApp && typeof tg !== 'undefined' && tg && tg.close) {
            setTimeout(() => {
                tg.close();
            }, 1000);
        }
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // ЛОГИКА ФАЙЛОВ И UI

    function initUser() {
        // Получаем данные пользователя из Telegram WebApp API
        const user = (typeof tg !== 'undefined' && tg?.initDataUnsafe?.user) ? tg.initDataUnsafe.user : null;

        if (user) {
            userId = user.id.toString();
            userName = user.first_name || user.username || 'Пользователь';
            userInfo.textContent = `👤 ${userName} (ID: ${userId})`;
        } else if (debugMode) {
            // В режиме DEBUG разрешаем работу без Telegram
            console.log('DEBUG MODE: Telegram WebApp not available, using manual User ID');
            userInfo.textContent = '🐛 DEBUG MODE: Введите User ID вручную';

            // Логика для дебаг-поля
            const debugUserIdInput = document.getElementById('debugUserId');
            const debugSetUserIdBtn = document.getElementById('debugSetUserId');

            if (debugSetUserIdBtn && debugUserIdInput) {
                debugSetUserIdBtn.addEventListener('click', () => {
                    const manualUserId = debugUserIdInput.value.trim();
                    if (manualUserId && !isNaN(manualUserId)) {
                        userId = manualUserId;
                        userInfo.textContent = `🐛 DEBUG: User ID установлен вручную (ID: ${userId})`;
                        updateMainButtonState();
                    } else {
                        showError('Введите корректный User ID (число)');
                    }
                });
                debugUserIdInput.value = '123456789';
                debugSetUserIdBtn.click();
            }
        } else {
            userInfo.textContent = '⚠️ Не удалось получить ID пользователя. Откройте приложение через Telegram.';
            uploadZone.style.pointerEvents = 'none';
            uploadZone.style.opacity = '0.5';
        }
        updateMainButtonState(); // Инициализация MainButton
    }

    function validateFile(file) {
        // Проверка расширения
        if (!file.name.toLowerCase().endsWith('.json')) {
            return {valid: false, error: 'Только JSON файлы'};
        }
        return {valid: true};
    }

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('drag-over');
    });
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('drag-over');
        const droppedFiles = Array.from(e.dataTransfer.files);
        handleNewFiles(droppedFiles);
    });

    fileInput.addEventListener('change', () => {
        handleNewFiles(Array.from(fileInput.files));
    });

    function handleNewFiles(newFiles) {
        errorEl.style.display = 'none';
        errorEl.textContent = '';

        if (files.length + newFiles.length > MAX_FILES) {
            handleError(`Вы пытаетесь добавить ${newFiles.length} файлов. Максимум ${MAX_FILES} файлов.`, false, false);
            return;
        }

        newFiles.forEach(file => {
            const validation = validateFile(file);
            if (validation.valid) {
                files.push(file);
            } else {
                showError(`Файл ${file.name}: ${validation.error}`);
            }
        });

        renderFiles();
        updateMainButtonState();
    }

    function renderFiles() {
        filesList.innerHTML = '';
        if (files.length === 0) {
            updateCombineRow();
            checkScrollIndicator();
            return;
        }

        files.forEach((file, i) => {
            const item = document.createElement('div');
            item.className = 'file-item' + (file.error ? ' error-file' : '');
            item.innerHTML = `
                    <span class="file-name" title="${file.name}">${file.name}</span>
                    <span class="file-size">${formatFileSize(file.size)}</span>
                    <button class="btn-remove" onclick="removeFile(${i})">✕</button>
                `;
            filesList.appendChild(item);
        });

        updateCombineRow();
        checkScrollIndicator();
    }

    function checkScrollIndicator() {
        const scrollIndicator = document.getElementById('scrollIndicator');
        const container = document.querySelector('.container');
        if (container && scrollIndicator) {
            const isScrollable = container.scrollHeight > window.innerHeight;
            const isScrolledToBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
            scrollIndicator.style.display = (isScrollable && !isScrolledToBottom) ? 'block' : 'none';
        }
    }

    window.addEventListener('scroll', checkScrollIndicator);
    window.addEventListener('resize', checkScrollIndicator);

    function updateCombineRow() {
        if (!combineRow) return;
        if (files.length >= 2) {
            combineRow.style.display = 'flex';
        } else {
            combineRow.style.display = 'none';
            if (combineCheckbox) combineCheckbox.checked = false;
        }
    }

    window.removeFile = (i) => {
        files.splice(i, 1);
        renderFiles();
        updateMainButtonState();
        errorEl.style.display = 'none';
    };

    // ЛОГИКА ЗАГРУЗКИ

    let uploadState = {
        files: null,
        uploads: [],
        currentFileIndex: 0,
        currentChunkIndex: 0,
        totalBytes: 0,
        uploadedBytes: 0
    };

    function generateUploadId() {
        return 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function splitFileIntoChunks(file) {
        const chunks = [];
        let offset = 0;
        let chunkIndex = 0;

        while (offset < file.size) {
            const chunk = file.slice(offset, offset + CHUNK_SIZE);
            chunks.push({
                index: chunkIndex,
                blob: chunk,
                start: offset,
                end: Math.min(offset + CHUNK_SIZE, file.size),
                size: chunk.size
            });
            offset += CHUNK_SIZE;
            chunkIndex++;
        }
        return chunks;
    }

    async function uploadChunk(uploadInfo, chunk, retryCount = 0) {
        return new Promise((resolve, reject) => {
            console.log(`[uploadChunk] Starting chunk ${chunk.index + 1}/${uploadInfo.totalChunks} (retry: ${retryCount})`);

            const formData = new FormData();
            formData.append('upload_id', uploadInfo.uploadId);
            formData.append('chunk_index', chunk.index);
            formData.append('total_chunks', uploadInfo.totalChunks);
            formData.append('filename', uploadInfo.filename);
            formData.append('file_size', uploadInfo.fileSize);
            formData.append('chunk', chunk.blob);
            formData.append('user_id', userId);

            const xhr = new XMLHttpRequest();
            xhr.timeout = 5 * 60 * 1000;

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const chunkProgress = (e.loaded / e.total) * chunk.size;
                    const totalProgress = uploadState.uploadedBytes + chunkProgress;
                    updateProgress(totalProgress, uploadState.totalBytes);
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            resolve(data);
                        } else {
                            reject(new Error(data.error || 'Ошибка загрузки чанка'));
                        }
                    } catch (e) {
                        reject(new Error('Ошибка парсинга ответа: ' + e.message));
                    }
                } else {
                    reject(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
                }
            });

            xhr.addEventListener('error', (e) => {
                if (retryCount < MAX_RETRIES) {
                    setTimeout(() => {
                        uploadChunk(uploadInfo, chunk, retryCount + 1)
                            .then(resolve)
                            .catch(reject);
                    }, 1000 * Math.pow(2, retryCount));
                } else {
                    reject(new Error('Превышено количество попыток загрузки чанка'));
                }
            });

            xhr.addEventListener('timeout', () => {
                if (retryCount < MAX_RETRIES) {
                    setTimeout(() => {
                        uploadChunk(uploadInfo, chunk, retryCount + 1)
                            .then(resolve)
                            .catch(reject);
                    }, 1000 * Math.pow(2, retryCount));
                } else {
                    reject(new Error('Превышено время ожидания загрузки чанка'));
                }
            });

            xhr.open('POST', '/api/upload-chunk');
            xhr.send(formData);
        });
    }

    function updateProgress(uploaded, total) {
        const percent = Math.round((uploaded / total) * 100);
        progressBar.style.width = percent + '%';
        progressBar.textContent = percent + '%';

        if (progressContainer.style.display !== 'block') {
            progressContainer.style.display = 'block';
        }

        // Обновляем текст MainButton
        if (typeof tg !== 'undefined' && tg?.MainButton) {
            tg.MainButton.setText(`Загрузка... ${percent}%`);
            tg.MainButton.disable(); // Отключаем на время загрузки
        }

        uploadState.uploads.forEach((uploadInfo, fileIdx) => {
            const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
            if (fileProgressEl) {
                const filePercent = Math.round((uploadInfo.uploadedBytes / uploadInfo.fileSize) * 100);
                if (filePercent === 100) {
                    fileProgressEl.querySelector('.file-progress-status').textContent = '📤';
                } else if (uploadInfo.uploadedBytes > 0) {
                    fileProgressEl.querySelector('.file-progress-status').textContent = '⏳';
                }
            }
        });
    }

    async function startChunkedUpload() {
        console.log('startChunkedUpload called');

        if (!files.length || !userId) {
            handleError('Выберите файлы для загрузки', false, false);
            return;
        }

        // Блокируем кнопку и показываем лоадер
        if (typeof tg !== 'undefined' && tg?.MainButton) {
            tg.MainButton.showProgress();
            tg.MainButton.setText('Подготовка...');
        }
        loading.style.display = 'block';
        errorEl.style.display = 'none';
        overlay.style.display = 'block';

        // Инициализация состояния
        uploadState.files = files;
        uploadState.uploads = [];
        uploadState.totalBytes = 0;
        uploadState.uploadedBytes = 0;

        files.forEach((file, fileIdx) => {
            const chunks = splitFileIntoChunks(file);
            const uploadId = generateUploadId();

            uploadState.uploads.push({
                uploadId: uploadId,
                filename: file.name,
                fileSize: file.size,
                chunks: chunks,
                totalChunks: chunks.length,
                uploadedChunks: 0,
                uploadedBytes: 0
            });
            uploadState.totalBytes += file.size;
        });

        filesProgress.innerHTML = '';
        uploadState.uploads.forEach((uploadInfo, fileIdx) => {
            const fileProgress = document.createElement('div');
            fileProgress.className = 'file-progress';
            fileProgress.id = `file-progress-${fileIdx}`;
            const fileSizeMB = (uploadInfo.fileSize / 1024 / 1024).toFixed(2);
            fileProgress.innerHTML = `
                    <span class="file-progress-name">${uploadInfo.filename} (${fileSizeMB} MB)</span>
                    <span class="file-progress-status">⏳</span>
                `;
            filesProgress.appendChild(fileProgress);
        });

        try {
            for (let fileIdx = 0; fileIdx < uploadState.uploads.length; fileIdx++) {
                const uploadInfo = uploadState.uploads[fileIdx];

                for (let chunkIdx = 0; chunkIdx < uploadInfo.chunks.length; chunkIdx++) {
                    const chunk = uploadInfo.chunks[chunkIdx];
                    await uploadChunk(uploadInfo, chunk);

                    uploadInfo.uploadedChunks++;
                    uploadInfo.uploadedBytes += chunk.size;
                    uploadState.uploadedBytes += chunk.size;
                    updateProgress(uploadState.uploadedBytes, uploadState.totalBytes);
                }

                const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
                if (fileProgressEl) {
                    fileProgressEl.querySelector('.file-progress-status').textContent = '📤';
                }
            }

            // Все чанки загружены, вызываем завершение загрузки и обработку
            if (typeof tg !== 'undefined' && tg?.MainButton) {
                tg.MainButton.setText('Обработка...');
                tg.MainButton.showProgress();
            }

            const formData = new FormData();
            formData.append('user_id', userId);
            uploadState.uploads.forEach((uploadInfo) => {
                formData.append('upload_ids[]', uploadInfo.uploadId);
            });
            formData.append('combine_results', combineCheckbox && combineCheckbox.checked ? 'true' : 'false');

            const xhr = new XMLHttpRequest();
            xhr.timeout = 30 * 60 * 1000;

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);

                        if (data.success === false) {
                            const errorMsg = data.error || data.message || 'Ошибка обработки файлов';
                            handleError(errorMsg, true, true);
                            return;
                        }

                        // Успешная обработка
                        overlay.style.display = 'none';
                        progressContainer.style.display = 'none';
                        loading.style.display = 'none';

                        uploadState.uploads.forEach((uploadInfo, fileIdx) => {
                            const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
                            if (fileProgressEl) {
                                fileProgressEl.querySelector('.file-progress-status').textContent = '✅';
                            }
                        });

                        if (typeof tg !== 'undefined' && tg && tg.sendData) {
                            tg.sendData(JSON.stringify({
                                success: true,
                                message: data.message || '✅ Файлы успешно обработаны!',
                                user_id: userId
                            }));
                        }

                        files = [];
                        uploadState.uploads = [];
                        renderFiles();
                        fileInput.value = '';

                        if (typeof tg !== 'undefined' && tg?.MainButton) {
                            tg.MainButton.hide();
                            tg.MainButton.hideProgress();
                        }

                        if (typeof tg !== 'undefined' && tg && tg.close) {
                            setTimeout(() => {
                                tg.close();
                            }, 1000);
                        }
                    } catch (err) {
                        handleError('Ошибка при обработке ответа: ' + err.message, true, true);
                    }
                } else {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        const errorMsg = data.error || 'Ошибка обработки файлов';
                        handleError(errorMsg + ` (HTTP ${xhr.status})`, true, true);
                    } catch (err) {
                        handleError(`Ошибка обработки (HTTP ${xhr.status})`, true, true);
                    }
                }
            });

            xhr.addEventListener('error', () => {
                handleError('Ошибка сети при обработке файлов', true, true);
            });

            xhr.addEventListener('timeout', () => {
                handleError('Превышено время ожидания обработки', true, true);
            });

            xhr.open('POST', '/api/complete-upload');
            xhr.send(formData);

        } catch (error) {
            // Ошибка в цикле загрузки чанков
            handleError('Ошибка загрузки: ' + error.message, true, true);
        }
    }


    function startUpload(retryAttempt = 0) {
        if (!currentFiles || !currentFiles.length || !userId) {
            handleError('Выберите файлы для загрузки', false, false);
            return;
        }

        // Управление MainButton
        if (typeof tg !== 'undefined' && tg?.MainButton) {
            tg.MainButton.showProgress();
            tg.MainButton.setText(retryAttempt > 0 ? `Повтор (${retryAttempt}/${MAX_RETRIES})` : 'Подготовка...');
        }

        loading.style.display = 'block';
        errorEl.style.display = 'none';
        overlay.style.display = 'block';
        uploadStartTime = Date.now();

        if (currentIsLargeFile) {
            progressContainer.style.display = 'block';
        }

        const formData = new FormData();
        formData.append('user_id', userId);
        formData.append('combine_results', combineCheckbox && combineCheckbox.checked ? 'true' : 'false');
        currentFiles.forEach(f => formData.append('files', f));
        currentFormData = formData;

        const xhr = new XMLHttpRequest();
        currentXhr = xhr;
        xhr.timeout = 30 * 60 * 1000;

        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);

                progressBar.style.width = percent + '%';
                progressBar.textContent = percent + '%';

                if (typeof tg !== 'undefined' && tg?.MainButton) {
                    tg.MainButton.setText(`Загрузка... ${percent}%`);
                    tg.MainButton.disable();
                }

                const elapsed = Date.now() - uploadStartTime;
                if (elapsed > 2000 || currentIsLargeFile) {
                    if (progressContainer.style.display !== 'block') {
                        progressContainer.style.display = 'block';
                    }
                }

                const filesCount = currentFiles ? currentFiles.length : 0;
                if (filesCount > 0) {
                    const filesPerPercent = 100 / filesCount;
                    currentFiles.forEach((file, i) => {
                        const fileProgressEl = document.getElementById(`file-progress-${i}`);
                        if (fileProgressEl) {
                            const fileStartPercent = i * filesPerPercent;
                            const fileEndPercent = (i + 1) * filesPerPercent;

                            if (percent >= fileEndPercent) {
                                fileProgressEl.querySelector('.file-progress-status').textContent = '📤';
                            } else if (percent > fileStartPercent) {
                                fileProgressEl.querySelector('.file-progress-status').textContent = '⏳';
                            }
                        }
                    });
                }
            }
        });

        xhr.addEventListener('load', () => {
            clearTimeout(progressTimeout);

            if (typeof tg !== 'undefined' && tg?.MainButton) {
                tg.MainButton.hideProgress();
            }

            if (xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);

                    if (data.success === false) {
                        const errorMsg = data.error || data.message || 'Ошибка при обработке файлов';
                        handleError(errorMsg, true, true);
                        return;
                    }

                    uploadRetryCount = 0;
                    overlay.style.display = 'none';
                    progressContainer.style.display = 'none';
                    loading.style.display = 'none';

                    currentFiles.forEach((file, i) => {
                        const fileProgressEl = document.getElementById(`file-progress-${i}`);
                        if (fileProgressEl) {
                            fileProgressEl.querySelector('.file-progress-status').textContent = '✅';
                        }
                    });

                    if (typeof tg !== 'undefined' && tg && tg.sendData) {
                        tg.sendData(JSON.stringify({
                            success: true,
                            message: data.message || '✅ Файлы успешно обработаны!',
                            user_id: userId
                        }));
                    }

                    files = [];
                    currentFiles = null;
                    renderFiles();
                    fileInput.value = '';
                    updateMainButtonState();

                    if (typeof tg !== 'undefined' && tg && tg.close) {
                        setTimeout(() => {
                            tg.close();
                        }, 1000);
                    }
                } catch (err) {
                    handleError('Ошибка при обработке ответа', true, true);
                }
            } else {
                try {
                    const data = JSON.parse(xhr.responseText);
                    const errorMsg = data.error || data.message || 'Неизвестная ошибка';
                    handleError(errorMsg + ` (HTTP ${xhr.status})`, true, true);
                } catch (err) {
                    handleError(`Ошибка загрузки (HTTP ${xhr.status})`, true, true);
                }
            }
        });

        xhr.addEventListener('error', (e) => {
            clearTimeout(progressTimeout);
            if (typeof tg !== 'undefined' && tg?.MainButton) {
                tg.MainButton.hideProgress();
            }

            const isNetworkError = xhr.status === 0 || xhr.statusText === '';
            const isRetryableError = isNetworkError && uploadRetryCount < MAX_RETRIES;

            if (isRetryableError) {
                uploadRetryCount++;
                const retryDelay = Math.min(1000 * Math.pow(2, uploadRetryCount - 1), 10000);

                setTimeout(() => {
                    if (currentXhr === xhr) {
                        startUpload(uploadRetryCount);
                    }
                }, retryDelay);
                return;
            }

            let errorMsg = 'Ошибка сети при загрузке файлов. ';
            if (xhr.status === 0) {
                errorMsg += 'Возможно, соединение прервано или сервер недоступен. ';
            } else if (xhr.status >= 500) {
                errorMsg += 'Ошибка на сервере. Попробуйте позже. ';
            }
            errorMsg += 'Для больших файлов (>100 МБ) загрузка может занять несколько минут.';

            handleError(errorMsg, true, true);
        });

        xhr.addEventListener('timeout', () => {
            clearTimeout(progressTimeout);
            if (typeof tg !== 'undefined' && tg?.MainButton) {
                tg.MainButton.hideProgress();
            }

            const timeoutMsg = 'Превышено время ожидания (30 минут). Файл слишком большой или соединение медленное. Попробуйте загрузить файл меньшего размера или проверьте скорость интернета.';
            handleError(timeoutMsg, true, true);
        });

        xhr.open('POST', '/api/upload');
        xhr.send(formData);

        if (!currentIsLargeFile) {
            progressTimeout = setTimeout(() => {
                if (progressContainer && progressContainer.style.display !== 'block') {
                    progressContainer.style.display = 'block';
                }
            }, 2000);
        }
    }

    // ИНИЦИАЛИЗАЦИЯ

    function initialize() {
        applyTheme();

        if (typeof tg !== 'undefined' && tg) {
            // Подписываемся на смену темы
            tg.onEvent('themeChanged', applyTheme);

            // Настраиваем Главную кнопку Telegram
            if (tg.MainButton) {
                tg.MainButton.onClick(startChunkedUpload);

                // реальные значения из themeParams вместо CSS переменных
                tg.MainButton.setParams({
                    color: tg.themeParams.button_color || '#0088cc',
                    text_color: tg.themeParams.button_text_color || '#ffffff'
                });

                tg.MainButton.hide();
            }
        }

        initUser();
        renderFiles();
    }

    document.addEventListener('DOMContentLoaded', initialize);
</script>
