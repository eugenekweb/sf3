<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов экспорта чата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        
        .user-info {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .info-text {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #0088cc;
        }
        
        .info-text b {
            color: #0088cc;
            font-weight: 600;
        }
        
        .upload-zone {
            border: 2px dashed #0088cc;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8f9ff;
        }
        
        .upload-zone:hover {
            border-color: #0077b6;
            background: #eef4ff;
        }
        
        .upload-zone.drag-over {
            background: #e3f2fd;
            border-color: #0077b6;
        }
        
        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        
        .upload-text {
            color: #333;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        
        .combine-row {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            background: #f4f8ff;
            border: 1px solid #d6e4ff;
            border-radius: 8px;
            font-size: 13px;
            color: #2c3e50;
            align-items: center;
            gap: 10px;
        }
        
        .combine-row label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
        }
        
        .combine-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .files-list {
            margin-top: 16px;
            max-height: 240px;
            overflow-y: auto;
        }
        
        .file-item {
            display: grid;
            grid-template-columns: 1fr 20% auto;
            align-items: center;
            padding: 4px 8px;
            background: #f8f8f8;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 13px;
            min-height: 0;
            line-height: 1.3;
            gap: 8px;
        }
        
        .file-item.error-file {
            background: #ffe6e6;
            border: 1px solid #ff9999;
        }
        
        .file-item.error {
            background: #ffe6e6;
            border: 1px solid #ff9999;
        }
        
        .file-name {
            width: 100%;
            word-break: break-all;
            color: #333;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-size {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
            text-align: right;
        }
        
        .btn-remove {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 0 4px;
            font-size: 16px;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .btn-remove:hover {
            color: #d32f2f;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover:not(:disabled) {
            background: #0077b6;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: #666;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #eee;
            border-top-color: #0088cc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            pointer-events: all;
        }
        
        .progress-container {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .progress-bar-wrapper {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0088cc, #0077b6);
            border-radius: 12px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        
        .file-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        
        .file-progress-name {
            flex: 1;
            word-break: break-all;
        }
        
        .file-progress-status {
            margin-left: 8px;
            font-size: 16px;
        }
        
        .scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 100;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Загрузка файлов экспорта</h1>
        <div class="user-info" id="userInfo">Загрузка...</div>
        
        {% if debug_mode %}
        <div class="debug-mode" id="debugMode" style="background: #fff3cd; border: 1px solid #ffc107; padding: 12px; margin: 16px 0; border-radius: 6px;">
            <strong>🐛 DEBUG MODE</strong><br>
            <label for="debugUserId" style="display: block; margin-top: 8px;">User ID (для тестирования):</label>
            <input type="text" id="debugUserId" placeholder="Введите User ID" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;">
            <button id="debugSetUserId" style="margin-top: 8px; padding: 6px 12px; background: #ffc107; border: none; border-radius: 4px; cursor: pointer;">Установить User ID</button>
        </div>
        {% endif %}
        
        <div class="info-text">
            📋 <b>Требования:</b><br>
            • Только JSON файлы<br>
            • Максимум 10 файлов за раз<br>
            • Размер каждого файла до 2 ГБ
        </div>
        
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Кликни или перетащи JSON файлы</div>
            <div class="upload-hint">Только формат JSON</div>
        </div>
        
        <div class="combine-row" id="combineRow">
            <label>
                <input type="checkbox" id="combineCheckbox">
                <span>Объединить результаты в один файл (название: combined_result_дата.xlsx)</span>
            </label>
        </div>
        
        <input type="file" id="fileInput" multiple accept=".json,application/json">
        
        <div class="files-list" id="filesList"></div>
        
        <button id="submitBtn" disabled>🚀 Загрузить и обработать</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Обработка файлов...</p>
        </div>
        
        <div class="error" id="error"></div>
        <div class="overlay" id="overlay"></div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
            <div id="filesProgress"></div>
        </div>
        <div class="scroll-indicator" id="scrollIndicator">⬇ Прокрутите вниз</div>
    </div>

    <script>
        // Инициализация Telegram WebApp (если доступен)
        const debugMode = {% if debug_mode %}true{% else %}false{% endif %};
        console.log('DEBUG MODE:', debugMode);
        let tg = null;
        
        if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        } else {
            console.log('Telegram WebApp not available (opened in browser)');
        }
        
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const filesList = document.getElementById('filesList');
        const combineRow = document.getElementById('combineRow');
        const combineCheckbox = document.getElementById('combineCheckbox');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const userInfo = document.getElementById('userInfo');
        const errorEl = document.getElementById('error');
        const overlay = document.getElementById('overlay');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const filesProgress = document.getElementById('filesProgress');
        
        const MAX_FILES = 10;
        let files = [];
        let userId = null;
        let userName = null;
        let uploadStartTime = null;
        let progressTimeout = null;

        function initUser() {
            // Получаем данные пользователя из Telegram WebApp API
            const user = (typeof tg !== 'undefined' && tg?.initDataUnsafe?.user) ? tg.initDataUnsafe.user : null;
            
            if (user) {
                userId = user.id.toString();
                userName = user.first_name || user.username || 'Пользователь';
                userInfo.textContent = `👤 ${userName} (ID: ${userId})`;
                submitBtn.disabled = false;
            } else if (debugMode) {
                // В режиме DEBUG разрешаем работу без Telegram
                console.log('DEBUG MODE: Telegram WebApp not available, using manual User ID');
                userInfo.textContent = '🐛 DEBUG MODE: Введите User ID вручную';
                submitBtn.disabled = false;
                uploadZone.style.pointerEvents = 'auto';
                uploadZone.style.opacity = '1';
                
                // Обработчик для установки User ID вручную
                const debugUserIdInput = document.getElementById('debugUserId');
                const debugSetUserIdBtn = document.getElementById('debugSetUserId');
                
                if (debugSetUserIdBtn && debugUserIdInput) {
                    debugSetUserIdBtn.addEventListener('click', () => {
                        const manualUserId = debugUserIdInput.value.trim();
                        if (manualUserId && !isNaN(manualUserId)) {
                            userId = manualUserId;
                            userInfo.textContent = `🐛 DEBUG: User ID установлен вручную (ID: ${userId})`;
                            submitBtn.disabled = files.length === 0;
                            console.log('DEBUG: User ID set to', userId);
                        } else {
                            alert('Введите корректный User ID (число)');
                        }
                    });
                    
                    // Автоматически устанавливаем тестовый ID при загрузке страницы
                    debugUserIdInput.value = '123456789';
                    debugSetUserIdBtn.click();
                } else {
                    console.error('DEBUG: Could not find debugUserIdInput or debugSetUserIdBtn');
                }
            } else {
                // Если открыто не из Telegram и не DEBUG - блокируем загрузку
                userInfo.textContent = '⚠️ Не удалось получить ID пользователя. Откройте приложение через Telegram.';
                submitBtn.disabled = true;
                uploadZone.style.pointerEvents = 'none';
                uploadZone.style.opacity = '0.5';
            }
        }

        function validateFile(file) {
            // Проверка расширения
            if (!file.name.toLowerCase().endsWith('.json')) {
                return { valid: false, error: 'Только JSON файлы' };
            }
            return { valid: true };
        }

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const droppedFiles = Array.from(e.dataTransfer.files);
            handleNewFiles(droppedFiles);
        });

        fileInput.addEventListener('change', () => {
            handleNewFiles(Array.from(fileInput.files));
        });

        function handleNewFiles(newFiles) {
            // Очищаем предыдущие ошибки
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            
            if (files.length + newFiles.length > MAX_FILES) {
                showError(`Вы пытаетесь добавить ${newFiles.length} файлов. Максимум ${MAX_FILES} файлов.`);
                return;
            }

            newFiles.forEach(file => {
                const validation = validateFile(file);
                if (validation.valid) {
                    files.push(file);
                } else {
                    showError(`Файл ${file.name}: ${validation.error}`);
                }
            });

            renderFiles();
            submitBtn.disabled = files.length === 0 || !userId;
        }

        function renderFiles() {
            filesList.innerHTML = '';
            if (files.length === 0) {
                updateCombineRow();
                checkScrollIndicator();
                return;
            }

            files.forEach((file, i) => {
                const item = document.createElement('div');
                item.className = 'file-item' + (file.error ? ' error-file' : '');
                item.innerHTML = `
                    <span class="file-name" title="${file.name}">${file.name}</span>
                    <span class="file-size">${formatFileSize(file.size)}</span>
                    <button class="btn-remove" onclick="removeFile(${i})">✕</button>
                `;
                filesList.appendChild(item);
            });
            
            updateCombineRow();
            checkScrollIndicator();
        }
        
        function checkScrollIndicator() {
            const scrollIndicator = document.getElementById('scrollIndicator');
            const container = document.querySelector('.container');
            if (container && scrollIndicator) {
                const isScrollable = container.scrollHeight > window.innerHeight;
                const isScrolledToBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
                scrollIndicator.style.display = (isScrollable && !isScrolledToBottom) ? 'block' : 'none';
            }
        }
        
        window.addEventListener('scroll', checkScrollIndicator);
        window.addEventListener('resize', checkScrollIndicator);
        
        function updateCombineRow() {
            if (!combineRow) return;
            if (files.length >= 2) {
                combineRow.style.display = 'flex';
            } else {
                combineRow.style.display = 'none';
                if (combineCheckbox) combineCheckbox.checked = false;
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        window.removeFile = (i) => {
            files.splice(i, 1);
            renderFiles();
            submitBtn.disabled = files.length === 0;
            errorEl.style.display = 'none';
        };

        function showError(message) {
            errorEl.textContent = '❌ ' + message;
            errorEl.style.display = 'block';
        }

        // Chunked Upload настройки
        const CHUNK_SIZE = 10 * 1024 * 1024; // 10 МБ на чанк
        const MAX_RETRIES = 3;
        let uploadState = {
            files: null,
            uploads: [], // Массив {uploadId, filename, chunks, totalChunks, uploadedChunks}
            currentFileIndex: 0,
            currentChunkIndex: 0,
            totalBytes: 0,
            uploadedBytes: 0
        };

        // Генерация уникального ID для загрузки
        function generateUploadId() {
            return 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Разбиение файла на чанки
        function splitFileIntoChunks(file) {
            const chunks = [];
            let offset = 0;
            let chunkIndex = 0;
            
            while (offset < file.size) {
                const chunk = file.slice(offset, offset + CHUNK_SIZE);
                chunks.push({
                    index: chunkIndex,
                    blob: chunk,
                    start: offset,
                    end: Math.min(offset + CHUNK_SIZE, file.size),
                    size: chunk.size
                });
                offset += CHUNK_SIZE;
                chunkIndex++;
            }
            
            return chunks;
        }

        // Загрузка одного чанка
        async function uploadChunk(uploadInfo, chunk, retryCount = 0) {
            return new Promise((resolve, reject) => {
                console.log(`[uploadChunk] Starting chunk ${chunk.index + 1}/${uploadInfo.totalChunks} (retry: ${retryCount})`);
                
                const formData = new FormData();
                formData.append('upload_id', uploadInfo.uploadId);
                formData.append('chunk_index', chunk.index);
                formData.append('total_chunks', uploadInfo.totalChunks);
                formData.append('filename', uploadInfo.filename);
                formData.append('file_size', uploadInfo.fileSize);
                formData.append('chunk', chunk.blob);
                formData.append('user_id', userId);

                const xhr = new XMLHttpRequest();
                xhr.timeout = 5 * 60 * 1000; // 5 минут на чанк
                
                console.log(`[uploadChunk] XHR created, opening POST to /api/upload-chunk`);

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        // Обновляем общий прогресс
                        const chunkProgress = (e.loaded / e.total) * chunk.size;
                        const fileProgress = uploadInfo.uploadedBytes + chunkProgress;
                        const totalProgress = uploadState.uploadedBytes + chunkProgress;
                        
                        updateProgress(totalProgress, uploadState.totalBytes);
                    }
                });

                xhr.addEventListener('load', () => {
                    console.log(`[uploadChunk] XHR load event: status=${xhr.status}`);
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            console.log(`[uploadChunk] Response:`, data);
                            if (data.success) {
                                resolve(data);
                            } else {
                                reject(new Error(data.error || 'Ошибка загрузки чанка'));
                            }
                        } catch (e) {
                            console.error(`[uploadChunk] Parse error:`, e);
                            reject(new Error('Ошибка парсинга ответа: ' + e.message));
                        }
                    } else {
                        console.error(`[uploadChunk] HTTP error: ${xhr.status} ${xhr.statusText}`);
                        reject(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
                    }
                });

                xhr.addEventListener('error', () => {
                    if (retryCount < MAX_RETRIES) {
                        console.log(`Retrying chunk ${chunk.index} (attempt ${retryCount + 1}/${MAX_RETRIES})`);
                        setTimeout(() => {
                            uploadChunk(uploadInfo, chunk, retryCount + 1)
                                .then(resolve)
                                .catch(reject);
                        }, 1000 * Math.pow(2, retryCount)); // Экспоненциальная задержка
                    } else {
                        reject(new Error('Превышено количество попыток загрузки чанка'));
                    }
                });

                xhr.addEventListener('timeout', () => {
                    if (retryCount < MAX_RETRIES) {
                        console.log(`Timeout on chunk ${chunk.index}, retrying (attempt ${retryCount + 1}/${MAX_RETRIES})`);
                        setTimeout(() => {
                            uploadChunk(uploadInfo, chunk, retryCount + 1)
                                .then(resolve)
                                .catch(reject);
                        }, 1000 * Math.pow(2, retryCount));
                    } else {
                        reject(new Error('Превышено время ожидания загрузки чанка'));
                    }
                });

                xhr.addEventListener('error', (e) => {
                    console.error(`[uploadChunk] XHR error event:`, e);
                    if (retryCount < MAX_RETRIES) {
                        console.log(`[uploadChunk] Retrying chunk ${chunk.index} (attempt ${retryCount + 1}/${MAX_RETRIES})`);
                        setTimeout(() => {
                            uploadChunk(uploadInfo, chunk, retryCount + 1)
                                .then(resolve)
                                .catch(reject);
                        }, 1000 * Math.pow(2, retryCount));
                    } else {
                        reject(new Error('Превышено количество попыток загрузки чанка'));
                    }
                });

                xhr.addEventListener('timeout', () => {
                    console.error(`[uploadChunk] XHR timeout`);
                    if (retryCount < MAX_RETRIES) {
                        console.log(`[uploadChunk] Retrying after timeout (attempt ${retryCount + 1}/${MAX_RETRIES})`);
                        setTimeout(() => {
                            uploadChunk(uploadInfo, chunk, retryCount + 1)
                                .then(resolve)
                                .catch(reject);
                        }, 1000 * Math.pow(2, retryCount));
                    } else {
                        reject(new Error('Превышено время ожидания загрузки чанка'));
                    }
                });
                
                console.log(`[uploadChunk] Opening POST request to /api/upload-chunk`);
                xhr.open('POST', '/api/upload-chunk');
                console.log(`[uploadChunk] Sending request...`);
                xhr.send(formData);
            });
        }

        // Обновление прогресс-бара
        function updateProgress(uploaded, total) {
            const percent = Math.round((uploaded / total) * 100);
            const uploadedMB = (uploaded / 1024 / 1024).toFixed(2);
            const totalMB = (total / 1024 / 1024).toFixed(2);
            
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
            
            if (progressContainer.style.display !== 'block') {
                progressContainer.style.display = 'block';
            }
            
            // Обновляем статусы файлов
            uploadState.uploads.forEach((uploadInfo, fileIdx) => {
                const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
                if (fileProgressEl) {
                    const filePercent = Math.round((uploadInfo.uploadedBytes / uploadInfo.fileSize) * 100);
                    if (filePercent === 100) {
                        fileProgressEl.querySelector('.file-progress-status').textContent = '📤';
                    } else if (uploadInfo.uploadedBytes > 0) {
                        fileProgressEl.querySelector('.file-progress-status').textContent = '⏳';
                    }
                }
            });
        }

        // Загрузка всех файлов по частям
        async function startChunkedUpload() {
            console.log('startChunkedUpload called');
            
            if (!files.length || !userId) {
                console.error('Validation failed: files=', files.length, 'userId=', userId);
                showError('Выберите файлы для загрузки');
                return;
            }

            console.log('Initializing upload state...');
            submitBtn.disabled = true;
            loading.style.display = 'block';
            errorEl.style.display = 'none';
            overlay.style.display = 'block';
            progressContainer.style.display = 'block';

            // Инициализация состояния загрузки
            uploadState.files = files;
            uploadState.uploads = [];
            uploadState.totalBytes = 0;
            uploadState.uploadedBytes = 0;

            console.log('Splitting files into chunks...');
            // Подготовка файлов: разбиение на чанки
            files.forEach((file, fileIdx) => {
                const chunks = splitFileIntoChunks(file);
                const uploadId = generateUploadId();
                
                console.log(`File ${fileIdx + 1}: ${file.name}, ${chunks.length} chunks, ${(file.size / 1024 / 1024).toFixed(2)} MB`);
                
                uploadState.uploads.push({
                    uploadId: uploadId,
                    filename: file.name,
                    fileSize: file.size,
                    chunks: chunks,
                    totalChunks: chunks.length,
                    uploadedChunks: 0,
                    uploadedBytes: 0
                });
                
                uploadState.totalBytes += file.size;
            });

            console.log(`Total: ${uploadState.uploads.length} file(s), ${(uploadState.totalBytes / 1024 / 1024).toFixed(2)} MB, ${uploadState.uploads.reduce((sum, u) => sum + u.totalChunks, 0)} chunks total`);

            // Инициализируем прогресс для каждого файла
            filesProgress.innerHTML = '';
            uploadState.uploads.forEach((uploadInfo, fileIdx) => {
                const fileProgress = document.createElement('div');
                fileProgress.className = 'file-progress';
                fileProgress.id = `file-progress-${fileIdx}`;
                const fileSizeMB = (uploadInfo.fileSize / 1024 / 1024).toFixed(2);
                fileProgress.innerHTML = `
                    <span class="file-progress-name">${uploadInfo.filename} (${fileSizeMB} MB)</span>
                    <span class="file-progress-status">⏳</span>
                `;
                filesProgress.appendChild(fileProgress);
            });

            console.log(`Starting chunked upload: ${files.length} file(s), ${(uploadState.totalBytes / 1024 / 1024).toFixed(2)} MB total`);

            try {
                console.log('Starting file upload loop...');
                // Загружаем все файлы последовательно
                for (let fileIdx = 0; fileIdx < uploadState.uploads.length; fileIdx++) {
                    const uploadInfo = uploadState.uploads[fileIdx];
                    console.log(`[File ${fileIdx + 1}/${uploadState.uploads.length}] Starting: ${uploadInfo.filename} (${uploadInfo.totalChunks} chunks)`);

                    // Загружаем все чанки файла последовательно
                    for (let chunkIdx = 0; chunkIdx < uploadInfo.chunks.length; chunkIdx++) {
                        const chunk = uploadInfo.chunks[chunkIdx];
                        console.log(`[File ${fileIdx + 1}] [Chunk ${chunkIdx + 1}/${uploadInfo.totalChunks}] Starting upload...`);

                        await uploadChunk(uploadInfo, chunk);
                        
                        console.log(`[File ${fileIdx + 1}] [Chunk ${chunkIdx + 1}/${uploadInfo.totalChunks}] Uploaded successfully`);
                        
                        // Обновляем прогресс файла
                        uploadInfo.uploadedChunks++;
                        uploadInfo.uploadedBytes += chunk.size;
                        uploadState.uploadedBytes += chunk.size;
                        
                        updateProgress(uploadState.uploadedBytes, uploadState.totalBytes);
                    }

                    // Отмечаем файл как загруженный
                    const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
                    if (fileProgressEl) {
                        fileProgressEl.querySelector('.file-progress-status').textContent = '✅';
                    }
                }

                // Все чанки загружены, вызываем завершение загрузки и обработку
                console.log('All chunks uploaded, completing upload...');
                
                const formData = new FormData();
                formData.append('user_id', userId);
                uploadState.uploads.forEach((uploadInfo) => {
                    formData.append('upload_ids[]', uploadInfo.uploadId);
                });
                formData.append('combine_results', combineCheckbox && combineCheckbox.checked ? 'true' : 'false');

                const xhr = new XMLHttpRequest();
                xhr.timeout = 30 * 60 * 1000; // 30 минут на обработку

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            
                            if (data.success === false) {
                                showError(data.error || data.message || 'Ошибка обработки файлов');
                                overlay.style.display = 'none';
                                progressContainer.style.display = 'none';
                                loading.style.display = 'none';
                                submitBtn.disabled = files.length === 0;
                                
                                if (typeof tg !== 'undefined' && tg && tg.sendData) {
                                    tg.sendData(JSON.stringify({
                                        success: false,
                                        message: '❌ Ошибка обработки файлов',
                                        user_id: userId
                                    }));
                                }
                                return;
                            }

                            // Успешная обработка
                            overlay.style.display = 'none';
                            progressContainer.style.display = 'none';
                            loading.style.display = 'none';

                            // Отмечаем все файлы как обработанные
                            uploadState.uploads.forEach((uploadInfo, fileIdx) => {
                                const fileProgressEl = document.getElementById(`file-progress-${fileIdx}`);
                                if (fileProgressEl) {
                                    fileProgressEl.querySelector('.file-progress-status').textContent = '✅';
                                }
                            });

                            // Отправляем данные в Telegram
                            if (typeof tg !== 'undefined' && tg && tg.sendData) {
                                tg.sendData(JSON.stringify({
                                    success: true,
                                    message: data.message || '✅ Файлы успешно обработаны!',
                                    user_id: userId
                                }));
                            }

                            // Очищаем форму
                            files = [];
                            uploadState.uploads = [];
                            renderFiles();
                            fileInput.value = '';

                            // Закрываем WebApp
                            if (typeof tg !== 'undefined' && tg && tg.close) {
                                setTimeout(() => {
                                    tg.close();
                                }, 1000);
                            }
                        } catch (err) {
                            showError('Ошибка при обработке ответа: ' + err.message);
                        }
                    } else {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            showError(data.error || 'Ошибка обработки файлов');
                        } catch (err) {
                            showError(`Ошибка обработки (HTTP ${xhr.status})`);
                        }
                    }
                    submitBtn.disabled = files.length === 0;
                });

                xhr.addEventListener('error', () => {
                    showError('Ошибка сети при обработке файлов');
                    overlay.style.display = 'none';
                    progressContainer.style.display = 'none';
                    loading.style.display = 'none';
                    submitBtn.disabled = files.length === 0;
                });

                xhr.addEventListener('timeout', () => {
                    showError('Превышено время ожидания обработки');
                    overlay.style.display = 'none';
                    progressContainer.style.display = 'none';
                    loading.style.display = 'none';
                    submitBtn.disabled = files.length === 0;
                });

                xhr.open('POST', '/api/complete-upload');
                xhr.send(formData);

            } catch (error) {
                console.error('Upload error:', error);
                showError('Ошибка загрузки: ' + error.message);
                overlay.style.display = 'none';
                progressContainer.style.display = 'none';
                loading.style.display = 'none';
                submitBtn.disabled = files.length === 0;
                
                if (typeof tg !== 'undefined' && tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        success: false,
                        message: '❌ Ошибка загрузки файлов',
                        user_id: userId
                    }));
                }
            }
        }

        // Старая функция startUpload (удаляем, но оставляем для совместимости)
        function startUpload(retryAttempt = 0) {
            if (!currentFiles || !currentFiles.length || !userId) {
                showError('Выберите файлы для загрузки');
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = 'block';
            errorEl.style.display = 'none';
            overlay.style.display = 'block';
            uploadStartTime = Date.now();
            
            if (retryAttempt > 0) {
                console.log(`Retry attempt ${retryAttempt} of ${MAX_RETRIES}`);
                showError(`Повторная попытка загрузки (${retryAttempt}/${MAX_RETRIES})...`);
            }
            
            // Для больших файлов показываем прогресс-бар сразу
            if (currentIsLargeFile) {
                console.log('Large file detected, showing progress bar immediately');
                progressContainer.style.display = 'block';
            }

            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('combine_results', combineCheckbox && combineCheckbox.checked ? 'true' : 'false');
            currentFiles.forEach(f => formData.append('files', f));
            currentFormData = formData;

            const xhr = new XMLHttpRequest();
            currentXhr = xhr;
            
            // Устанавливаем большой таймаут для больших файлов (30 минут)
            xhr.timeout = 30 * 60 * 1000; // 30 минут в миллисекундах
            
            // Отслеживание прогресса загрузки
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    const loadedMB = (e.loaded / 1024 / 1024).toFixed(2);
                    const totalMB = (e.total / 1024 / 1024).toFixed(2);
                    
                    progressBar.style.width = percent + '%';
                    progressBar.textContent = percent + '%';
                    
                    // Показываем прогресс-бар если загрузка идет более 2 секунд или для больших файлов
                    const elapsed = Date.now() - uploadStartTime;
                    if (elapsed > 2000 || currentIsLargeFile) {
                        if (progressContainer.style.display !== 'block') {
                            progressContainer.style.display = 'block';
                            console.log(`Progress bar shown: ${loadedMB} MB / ${totalMB} MB (${percent}%)`);
                        }
                    }
                    
                    // Логируем прогресс каждые 10%
                    if (percent % 10 === 0) {
                        console.log(`Upload progress: ${percent}% (${loadedMB} MB / ${totalMB} MB)`);
                    }
                    
                    // Обновляем статусы файлов на основе общего прогресса
                    // Приблизительно распределяем прогресс по файлам
                    // Считаем, что загрузка файла завершена когда общий прогресс превышает его долю
                    const filesCount = currentFiles ? currentFiles.length : 0;
                    if (filesCount > 0) {
                        const filesPerPercent = 100 / filesCount;
                        currentFiles.forEach((file, i) => {
                            const fileProgressEl = document.getElementById(`file-progress-${i}`);
                            if (fileProgressEl) {
                                // Каждый файл занимает свою долю прогресса
                                const fileStartPercent = i * filesPerPercent;
                                const fileEndPercent = (i + 1) * filesPerPercent;
                                
                                if (percent >= fileEndPercent) {
                                    // Файл полностью загружен, отмечаем как обрабатывается
                                    fileProgressEl.querySelector('.file-progress-status').textContent = '📤';
                                } else if (percent > fileStartPercent) {
                                    // Файл загружается
                                    fileProgressEl.querySelector('.file-progress-status').textContent = '⏳';
                                }
                            }
                        });
                    }
                }
            });
            
            xhr.addEventListener('load', () => {
                clearTimeout(progressTimeout);
                
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        
                        // Проверяем флаг success в ответе
                        if (data.success === false) {
                            // Сервер вернул успешный HTTP статус, но указал, что обработка не удалась
                            overlay.style.display = 'none';
                            progressContainer.style.display = 'none';
                            loading.style.display = 'none';
                            
                            const errorMsg = data.error || data.message || 'Ошибка при обработке файлов';
                            showError(errorMsg);
                            
                            if (typeof tg !== 'undefined' && tg && tg.sendData) {
                                tg.sendData(JSON.stringify({
                                    success: false,
                                    message: '❌ ' + errorMsg,
                                    user_id: userId
                                }));
                            } else if (debugMode) {
                                console.error('DEBUG: Upload failed:', errorMsg);
                            }
                            
                            submitBtn.disabled = files.length === 0;
                            uploadRetryCount = 0;
                            return;
                        }
                        
                        // Успешная загрузка - сбрасываем счетчик повторов
                        uploadRetryCount = 0;
                        
                        overlay.style.display = 'none';
                        progressContainer.style.display = 'none';
                        loading.style.display = 'none';
                        
                        // Отмечаем все файлы как загруженные
                        currentFiles.forEach((file, i) => {
                            const fileProgressEl = document.getElementById(`file-progress-${i}`);
                            if (fileProgressEl) {
                                fileProgressEl.querySelector('.file-progress-status').textContent = '✅';
                            }
                        });
                        
                        // Отправляем данные в Telegram только если доступен tg объект
                        if (typeof tg !== 'undefined' && tg && tg.sendData) {
                            tg.sendData(JSON.stringify({
                                success: true,
                                message: data.message || '✅ Файлы успешно обработаны!',
                                user_id: userId
                            }));
                        } else if (debugMode) {
                            console.log('DEBUG: Upload successful, data:', data);
                        }
                        
                        // Очищаем форму
                        files = [];
                        currentFiles = null;
                        renderFiles();
                        fileInput.value = '';
                        
                        // Закрываем окно WebApp после успешной обработки (только если открыто из Telegram)
                        if (typeof tg !== 'undefined' && tg && tg.close) {
                            setTimeout(() => {
                                tg.close();
                            }, 1000);
                        } else if (debugMode) {
                            console.log('DEBUG: Upload completed, WebApp would close in Telegram');
                        }
                    } catch (err) {
                        showError('Ошибка при обработке ответа');
                    }
                } else {
                    // HTTP статус не 200 - обрабатываем как ошибку
                    try {
                        const data = JSON.parse(xhr.responseText);
                        const errorMsg = data.error || data.message || 'Неизвестная ошибка';
                        showError(errorMsg);
                    } catch (err) {
                        showError(`Ошибка загрузки (HTTP ${xhr.status})`);
                    }
                }
                submitBtn.disabled = files.length === 0;
            });
            
            xhr.addEventListener('error', (e) => {
                clearTimeout(progressTimeout);
                
                console.error('Upload error:', {
                    status: xhr.status,
                    statusText: xhr.statusText,
                    readyState: xhr.readyState,
                    responseText: xhr.responseText?.substring(0, 200)
                });
                
                // Проверяем, можно ли повторить попытку
                // Только реальные сетевые ошибки (status === 0 или пустой statusText) должны повторяться
                // HTTP ошибки (4xx, 5xx) не должны повторяться, так как это ошибки приложения
                const isNetworkError = xhr.status === 0 || xhr.statusText === '';
                const isRetryableError = isNetworkError && uploadRetryCount < MAX_RETRIES;
                
                if (isRetryableError) {
                    uploadRetryCount++;
                    console.log(`Network error detected, retrying... (${uploadRetryCount}/${MAX_RETRIES})`);
                    
                    // Ждем перед повторной попыткой (экспоненциальная задержка)
                    const retryDelay = Math.min(1000 * Math.pow(2, uploadRetryCount - 1), 10000); // Максимум 10 секунд
                    
                    setTimeout(() => {
                        if (currentXhr === xhr) { // Проверяем, что это все еще актуальный запрос
                            startUpload(uploadRetryCount);
                        }
                    }, retryDelay);
                    return;
                }
                
                // Если повторные попытки исчерпаны или ошибка не повторяемая
                overlay.style.display = 'none';
                progressContainer.style.display = 'none';
                loading.style.display = 'none';
                
                // Более детальное сообщение об ошибке
                let errorMsg = 'Ошибка сети при загрузке файлов. ';
                if (xhr.status === 0) {
                    errorMsg += 'Возможно, соединение прервано или сервер недоступен. ';
                    if (uploadRetryCount >= MAX_RETRIES) {
                        errorMsg += `Попытки повторной загрузки исчерпаны (${MAX_RETRIES}). `;
                        errorMsg += 'Проверьте настройки Cloudflare Tunnel (таймауты, HTTP/2). ';
                    }
                } else if (xhr.status >= 500) {
                    errorMsg += 'Ошибка на сервере. Попробуйте позже. ';
                } else if (xhr.status >= 400) {
                    errorMsg += 'Ошибка запроса. Проверьте файл и попробуйте снова. ';
                }
                errorMsg += 'Для больших файлов (>100 МБ) загрузка может занять несколько минут.';
                
                showError(errorMsg);
                if (typeof tg !== 'undefined' && tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        success: false,
                        message: '❌ Ошибка сети при загрузке',
                        user_id: userId
                    }));
                } else if (debugMode) {
                    console.error('DEBUG: Upload error:', errorMsg);
                }
                submitBtn.disabled = files.length === 0;
                uploadRetryCount = 0; // Сбрасываем счетчик для следующей загрузки
            });
            
            xhr.addEventListener('timeout', () => {
                clearTimeout(progressTimeout);
                overlay.style.display = 'none';
                progressContainer.style.display = 'none';
                loading.style.display = 'none';
                
                console.error('Upload timeout after 30 minutes');
                
                showError('Превышено время ожидания (30 минут). Файл слишком большой или соединение медленное. Попробуйте загрузить файл меньшего размера или проверьте скорость интернета.');
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        success: false,
                        message: '❌ Превышено время ожидания загрузки',
                        user_id: userId
                    }));
                } else if (debugMode) {
                    console.error('DEBUG: Upload timeout');
                }
                submitBtn.disabled = files.length === 0;
            });
            
            xhr.open('POST', '/api/upload');
            
            console.log('Starting XHR upload request');
            xhr.send(formData);
            
            // Показываем прогресс-бар через 2 секунды, если загрузка еще идет (для маленьких файлов)
            if (!currentIsLargeFile) {
                progressTimeout = setTimeout(() => {
                    if (progressContainer && progressContainer.style.display !== 'block') {
                        progressContainer.style.display = 'block';
                        console.log('Progress bar shown after 2 seconds');
                    }
                }, 2000);
            }
        }

        submitBtn.addEventListener('click', () => {
            console.log('Submit button clicked');
            console.log('Files:', files.length, 'UserId:', userId);
            
            if (!files.length || !userId) {
                showError('Выберите файлы для загрузки');
                return;
            }

            if (files.length > MAX_FILES) {
                showError(`Максимум ${MAX_FILES} файлов`);
                return;
            }

            console.log('Starting chunked upload...');
            startChunkedUpload();
        });

        initUser();
    </script>
</body>
</html>
