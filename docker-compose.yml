services:
    tuna:
        image: yuccastream/tuna:latest
        container_name: tuna_tunnel
        command: http web:5000
        depends_on:
            - web
        networks:
            - app_network
        volumes:
            - tuna_config:/root/.config/tuna
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "2"
        environment:
            - TUNA_TOKEN=${TUNA_TOKEN}

    web:
        build: ./web
        container_name: web_server
        ports:
            - "5000:5000"
        environment:
            - BOT_TOKEN=${BOT_TOKEN}
            - FLASK_ENV=${FLASK_ENV:-production}
            - DEBUG=${DEBUG:-false}
            - BACKEND_URL=${BACKEND_URL}
        volumes:
            - ./uploads:/app/uploads
        networks:
            - app_network
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    bot:
        build: ./bot
        container_name: telegram_bot
        environment:
            - BOT_TOKEN=${BOT_TOKEN}
            - BACKEND_URL=${BACKEND_URL:-http://localhost:5000}
            - FLASK_ENV=${FLASK_ENV:-production}
        depends_on:
            - web
        networks:
            - app_network
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

networks:
    app_network:
        driver: bridge

volumes:
    uploads:
        driver: local
    tuna_config:
        driver: local
